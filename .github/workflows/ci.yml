name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  smoke-test:
    name: smoke-test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: lexintake
          POSTGRES_PASSWORD: lexintake
          POSTGRES_DB: lexintake
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lexintake -d lexintake"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      PYTHONPATH: .
      LEXINTAKE_EMBEDDING_PROVIDER: openai
      LEXINTAKE_EMBEDDING_MODEL: text-embedding-3-small
      LEXINTAKE_EMBEDDING_DIMS: "1536"
      LEXINTAKE_LLM_PROVIDER: openai
      LEXINTAKE_LLM_MODEL: gpt-4.1
      LEXINTAKE_AGNO_TRACING: "1"
      DATABASE_URL: postgresql://lexintake:lexintake@localhost:5432/lexintake
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Require OpenAI API key
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo "Repository secret OPENAI_API_KEY is required for CI." >&2
            exit 1
          fi

      - name: Initialize PostgreSQL schema + seed
        run: python -m db.init_structured_db

      - name: Load KB documents into pgvector
        run: python -m etl.pipeline

      - name: Run unit tests
        run: pytest tests/ -q

      - name: Run demo scenarios
        run: python frontend/demo.py

      - name: Run limited evaluation
        run: >
          python evaluation/run_evaluation.py
          --providers openai:gpt-4.1
          --limit 5
          --require-all

      - name: Upload CI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lexintake-ci-logs
          path: |
            evaluation/logs/
            monitoring/logs/
          if-no-files-found: warn
          retention-days: 14
