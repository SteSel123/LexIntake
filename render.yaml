# LexIntake backend on Render (FastAPI + Postgres/pgvector).
# Dashboard: New → Blueprint → connect this repo, or: render blueprint launch
#
# After first deploy, set secret OPENAI_API_KEY in the Render dashboard
# (Environment → Add Secret).

databases:
  - name: lexintake-db
    plan: free
    databaseName: lexintake
    user: lexintake
    postgresMajorVersion: "16"

services:
  - type: web
    name: lexintake-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/render_start.py
    healthCheckPath: /health
    envVars:
      - key: PYTHONPATH
        value: /app
      - key: DATABASE_URL
        fromDatabase:
          name: lexintake-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: LEXINTAKE_EMBEDDING_PROVIDER
        value: openai
      - key: LEXINTAKE_EMBEDDING_MODEL
        value: text-embedding-3-small
      - key: LEXINTAKE_EMBEDDING_DIMS
        value: "1536"
      - key: LEXINTAKE_LLM_PROVIDER
        value: openai
      - key: LEXINTAKE_LLM_MODEL
        value: gpt-4.1
      - key: LEXINTAKE_AGNO_TRACING
        value: "0"
      - key: ALLOWED_ORIGINS
        sync: false
