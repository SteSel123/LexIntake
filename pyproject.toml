[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lexintake"
version = "1.0.0"
description = "Agentic RAG intake screening for law firms"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agents*",
    "backend*",
    "db*",
    "etl*",
    "tools*",
    "scoring*",
    "monitoring*",
    "evaluation*",
    "frontend*",
    "scripts*",
]
